services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desk-pet-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1

    # 알림 설정·이력(SQLite)이 컨테이너를 다시 만들어도 남도록 보관
    volumes:
      - desk-pet-data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  desk-pet-data:
